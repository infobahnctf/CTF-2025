apiVersion: kctf.dev/v1
kind: Challenge
metadata:
  name: translator
spec:
  deployed: true
  powDifficultySeconds: 0
  network:
    public: true
    ports:
      - protocol: "HTTPS"
        targetPort: 1337
        domains:
          - "challs3.infobahnc.tf"
  healthcheck:
    enabled: false
  podTemplate:
    template:
      spec:
        containers:
          - name: challenge
            env:
              - name: FLAG
                value: infobahn{1F_0N1Y_Xh7M1_W0N}
            securityContext:
              readOnlyRootFilesystem: false
