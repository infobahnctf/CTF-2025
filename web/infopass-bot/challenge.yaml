apiVersion: kctf.dev/v1
kind: Challenge
metadata:
  name: infopass-bot
spec:
  deployed: true
  powDifficultySeconds: 0
  network:
    public: true
    ports:
      - protocol: "HTTPS"
        targetPort: 1337
        domains:
          - "challs2.infobahnc.tf"
  podTemplate:
    template:
      spec:
        containers:
          - name: challenge
            env:
              - name: FLAG
                value: "infobahn{this_is_my_password_keep_it_safe!->qwerty123}"
              - name: APP_URL
                value: "https://infopass-web.challs2.infobahnc.tf/"
            securityContext:
              seccompProfile:
                type: Unconfined
              readOnlyRootFilesystem: false
  healthcheck:
    enabled: false
