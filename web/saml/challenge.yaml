apiVersion: kctf.dev/v1
kind: Challenge
metadata:
  name: saml
spec:
  deployed: true
  powDifficultySeconds: 0
  network:
    public: true
    ports:
      - protocol: "HTTPS"
        targetPort: 1337
        domains:
          - "challs.infobahnc.tf"
  podTemplate:
    template:
      spec:
        containers:
          - name: challenge
            env:
              - name: FLAG
                value: "infobahn{The_S_in_SAML_stands_for_serpentine}"
              - name: IDPHOST
                value: "https://saml-idp-challs.infobahnc.tf"
  healthcheck:
    enabled: false
