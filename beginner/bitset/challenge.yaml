apiVersion: kctf.dev/v1
kind: Challenge
metadata:
  name: bitset
spec:
  deployed: true
  powDifficultySeconds: 0
  network:
    public: true
    ports:
      - protocol: "HTTPS"
        targetPort: 1337
  healthcheck:
    enabled: false
  podTemplate:
    template:
      spec:
        containers:
          - name: challenge
            securityContext:
              readOnlyRootFilesystem: false
