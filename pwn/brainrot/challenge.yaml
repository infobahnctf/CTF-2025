apiVersion: kctf.dev/v1
kind: Challenge
metadata:
  name: brainrot
spec:
  deployed: true
  powDifficultySeconds: 0
  network:
    public: true
  healthcheck:
    enabled: false
  podTemplate:
    template:
      spec:
        containers:
          - name: challenge
            securityContext:
              readOnlyRootFilesystem: false
              privileged: true
